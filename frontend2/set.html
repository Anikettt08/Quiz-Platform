<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPS TOPIK Test Sets</title>
<link rel="stylesheet" href="styles.css">
<style>
.set-page{min-height:100vh;background:var(--bg)}
.set-header{height:83px;background:var(--cyan)}
.set-container{max-width:1180px;margin:auto;padding:20px 28px 50px}
.student-row {
  display:flex;
  justify-content:flex-end;
  margin:0 70px 55px 0;
}

.profile-card {
  display:flex;
  align-items:center;
  gap:12px;
  background:#fff;
  padding:8px 18px 8px 8px;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
  color:#111827;
}

.profile-avatar {
  width:50px;
  height:50px;
  border-radius:50%;
  background:#eef4ff;
  color:#3767b0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:17px;
  font-weight:700;
}

.profile-details {
  display:flex;
  flex-direction:column;
  line-height:1.25;
}

.profile-name {
  font-size:18px;
  font-weight:700;
  color:#111827;
}

.profile-roll {
  font-size:13px;
  font-weight:600;
  color:#5f6b7a;
}
.set-layout{display:grid;grid-template-columns:330px 1fr;gap:125px;align-items:start}
.category-list{display:grid;gap:14px}
.category-btn{height:45px;border:1px solid #2368a8;border-radius:7px;background:var(--cyan);color:#fff;font-size:21px;cursor:pointer}
.category-btn:hover,.category-btn.active{background:var(--cyan-dark)}
.sets{display:grid;grid-template-columns:repeat(3,1fr);column-gap:40px;row-gap:14px}
.set-btn{height:45px;border:0;background:var(--cyan);color:#fff;font-size:20px;cursor:pointer}
.set-btn:hover{background:var(--cyan-dark)}
.set-btn.locked{cursor:not-allowed;opacity:.88}
.set-note{text-align:center;margin-top:24px;color:var(--muted);font-size:13px}
@media(max-width:900px){.student-row{margin-right:0;justify-content:center}.set-layout{grid-template-columns:1fr;gap:35px}.sets{column-gap:12px}}
@media(max-width:600px){.student-row{font-size:16px;margin-bottom:30px}.set-container{padding:15px}.sets{grid-template-columns:1fr}.category-list{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="set-page">
  <div class="set-header"></div>
  <div class="set-container">
    <div class="student-row">
  <div class="profile-card">
    <div class="profile-avatar">SL</div>

    <div class="profile-details">
      <div class="profile-name">Sun Lee</div>
      <div class="profile-roll">Roll No. 2023000950</div>
    </div>
  </div>
</div>

    <div class="set-layout">
      <div class="category-list">
        <button class="category-btn active">Korean Vowels &amp; Consonants</button>
        <button class="category-btn">Korean Numbers</button>
        <button class="category-btn">Counting Units</button>
        <button class="category-btn">Parts of Speech</button>
        <button class="category-btn">Tense</button>
        <button class="category-btn">Formal &amp; Informal Language</button>
        <button class="category-btn">Indirect Speech</button>
        <button class="category-btn">EPS TOPIK TEXT BOOK</button>
      </div>

      <div>
        <div class="sets">
          <button class="set-btn" id="freeSet">Set No. 01 - Free</button>
          <button class="set-btn locked">Set No. 02</button>
          <button class="set-btn locked">Set No. 03</button>
          <button class="set-btn locked">Set No. 04</button>
          <button class="set-btn locked">Set No. 01</button>
          <button class="set-btn locked">Set No. 01</button>
          <button class="set-btn locked">Set No. 01</button>
          <button class="set-btn locked">Set No. 01</button>
          <button class="set-btn locked">Set No. 01</button>
          <button class="set-btn locked">Set No. 01</button>
          <button class="set-btn locked">Set No. 01</button>
          <button class="set-btn locked">Set No. 01</button>
          <button class="set-btn locked">Set No. 01</button>
          <button class="set-btn locked">Set No. 01</button>
          <button class="set-btn locked">Set No. 01</button>
          <button class="set-btn locked">Set No. 01</button>
          <button class="set-btn locked">Set No. 01</button>
          <button class="set-btn locked">Set No. 01</button>
          <button class="set-btn locked">Set No. 01</button>
          <button class="set-btn locked">Set No. 01</button>
          <button class="set-btn locked">Set No. 01</button>
        </div>
        <div class="set-note">Set No. 01 is currently available as the free practice test.</div>
      </div>
    </div>
  </div>
</div>

<script>
document.getElementById("freeSet").onclick = () => {
 window.location.href = "exam-instructions.html";
};

document.querySelectorAll(".locked").forEach(btn => {
  btn.onclick = () => alert("This test set is currently locked.");
});

document.querySelectorAll(".category-btn").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".category-btn").forEach(x => x.classList.remove("active"));
    btn.classList.add("active");
  };
});
</script>
</body>
</html>
